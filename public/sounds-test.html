<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Scroll tick options</title>
<style>body{margin:0;background:#fff;color:#111;font:15px/1.4 system-ui,sans-serif;padding:32px 16px}h1{font-size:22px;font-weight:500;margin:0 0 6px}p{color:#888;margin:0 0 24px;max-width:560px}
.g{display:grid;gap:10px;max-width:560px}button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border:1px solid #e6e6e6;border-radius:14px}button:hover{border-color:#111}button b{font-weight:500}button span{color:#888;font-size:13px}</style></head><body>
<h1>Subtle scroll tick — pick one</h1><p>Very quiet on purpose: they should sit under the motion. Click to hear once, hold to hear it like scrolling. Tell me the letter.</p>
<div class="g">
<button data-v="A"><b>A · Fingertip on wood (now on the site)</b><span>hold = scrolling</span></button>
<button data-v="B"><b>B · Even softer, no body</b><span>hold = scrolling</span></button>
<button data-v="C"><b>C · Paper tick</b><span>hold = scrolling</span></button>
<button data-v="D"><b>D · Low wooden knock</b><span>hold = scrolling</span></button>
</div>
<script>
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const V={A:{vol:.12,lp:1600,bp:850,q:.9,len:.01,body:[320,240,.35,.05]},B:{vol:.1,lp:1200,bp:700,q:.8,len:.008,body:null},C:{vol:.07,lp:5000,bp:2200,q:1.2,len:.005,body:null},D:{vol:.14,lp:1100,bp:600,q:.8,len:.012,body:[210,150,.5,.07]}};
function tick(p){const t=ctx.currentTime+.002,out=ctx.createGain();out.gain.value=p.vol;const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=p.lp;out.connect(lp);lp.connect(ctx.destination);
const n=Math.floor(ctx.sampleRate*p.len),b=ctx.createBuffer(1,n,ctx.sampleRate),c=b.getChannelData(0);for(let k=0;k<n;k++)c[k]=(Math.random()*2-1)*Math.pow(1-k/n,5);
const s=ctx.createBufferSource();s.buffer=b;const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=p.bp;bp.Q.value=p.q;s.connect(bp);bp.connect(out);s.start(t);
if(p.body){const o=ctx.createOscillator();o.frequency.setValueAtTime(p.body[0],t);o.frequency.exponentialRampToValueAtTime(p.body[1],t+.03);const g=ctx.createGain();g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(p.body[2],t+.003);g.gain.exponentialRampToValueAtTime(.0001,t+p.body[3]);o.connect(g);g.connect(out);o.start(t);o.stop(t+p.body[3]+.02)}}
document.querySelectorAll('button').forEach(b=>{let t;const p=V[b.dataset.v];b.addEventListener('pointerdown',async()=>{if(ctx.state!=='running')await ctx.resume();tick(p);let n=0;t=setTimeout(function run(){tick(p);n++;t=setTimeout(run,n<3?140:n<6?220:360)},300)});['pointerup','pointerleave'].forEach(e=>b.addEventListener(e,()=>clearTimeout(t)))});
</script></body></html>
