<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Scroll tone options</title>
<style>body{margin:0;background:#fff;color:#111;font:15px/1.4 system-ui,sans-serif;padding:32px 16px}h1{font-size:22px;font-weight:500;margin:0 0 6px}p{color:#888;margin:0 0 24px;max-width:560px}
.g{display:grid;gap:10px;max-width:560px}button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border:1px solid #e6e6e6;border-radius:14px}button:hover{border-color:#111}button b{font-weight:500}button span{color:#888;font-size:13px}</style></head><body>
<h1>Smooth scroll tone — pick one</h1><p>Soft tones, no click. Click to hear once, hold to hear it like scrolling. Tell me the letter.</p>
<div class="g">
<button data-v="A"><b>A · Soft tone (now on the site)</b><span>hold = scrolling</span></button>
<button data-v="B"><b>B · Lower, warmer</b><span>hold = scrolling</span></button>
<button data-v="C"><b>C · Lower and even quieter</b><span>hold = scrolling</span></button>
<button data-v="D"><b>D · Short, airy</b><span>hold = scrolling</span></button>
</div>
<script>
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const V={A:{f:330,vol:.05,rise:.012,tau:.06,lp:1400},B:{f:220,vol:.07,rise:.015,tau:.07,lp:1000},C:{f:196,vol:.04,rise:.02,tau:.08,lp:800},D:{f:392,vol:.035,rise:.008,tau:.035,lp:1800}};
function tone(p){const t=ctx.currentTime+.005,g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p.vol,t+p.rise);g.gain.setTargetAtTime(0,t+p.rise,p.tau);
const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=p.lp;g.connect(lp);lp.connect(ctx.destination);
for(const [m,a] of [[1,1],[1.0055,.7],[2,.12]]){const o=ctx.createOscillator();o.frequency.value=p.f*m;const og=ctx.createGain();og.gain.value=a;o.connect(og);og.connect(g);o.start(t);o.stop(t+.5)}}
document.querySelectorAll('button').forEach(b=>{let t;const p=V[b.dataset.v];b.addEventListener('pointerdown',async()=>{if(ctx.state!=='running')await ctx.resume();tone(p);let n=0;t=setTimeout(function run(){tone(p);n++;t=setTimeout(run,n<3?160:n<6?240:380)},320)});['pointerup','pointerleave'].forEach(e=>b.addEventListener(e,()=>clearTimeout(t)))});
</script></body></html>
