<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Scroll click options</title>
<style>body{margin:0;background:#fff;color:#111;font:15px/1.4 system-ui,sans-serif;padding:32px 16px}h1{font-size:22px;font-weight:500;margin:0 0 6px}p{color:#888;margin:0 0 24px;max-width:560px}
.g{display:grid;gap:10px;max-width:560px}button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 18px;border:1px solid #e6e6e6;border-radius:14px}button:hover{border-color:#111}button b{font-weight:500}button span{color:#888;font-size:13px}</style></head><body>
<h1>Scroll click — pick one</h1><p>Click a sound to hear it once; hold it to hear it the way scrolling through projects sounds. Tell me the number you like.</p>
<div class="g"><button data-s="/sfx-test/studio-typing.mp3"><b>1 · Studio (now on the site)</b><span>click · hold = scrolling</span></button><button data-s="/sfx-test/mechanical-typing.mp3"><b>2 · Mechanical</b><span>click · hold = scrolling</span></button><button data-s="/sfx-test/organic-typing.mp3"><b>3 · Organic</b><span>click · hold = scrolling</span></button><button data-s="/sfx-test/rubber-typing.mp3"><b>4 · Rubber</b><span>click · hold = scrolling</span></button><button data-s="/sfx-test/minimal-typing.mp3"><b>5 · Minimal</b><span>click · hold = scrolling</span></button><button data-s="/sfx-test/soft-typing.mp3"><b>6 · Soft</b><span>click · hold = scrolling</span></button><button data-s="/sfx-test/zen-typing.mp3"><b>7 · Zen</b><span>click · hold = scrolling</span></button><button data-s="/sfx-test/zen-press.mp3"><b>8 · Zen press (lowest)</b><span>click · hold = scrolling</span></button></div>
<script>const ctx=new (window.AudioContext||window.webkitAudioContext)();const cache={};
const buf=u=>cache[u]||(cache[u]=fetch(u).then(r=>r.arrayBuffer()).then(b=>ctx.decodeAudioData(b)));
async function play(u){if(ctx.state!=='running')await ctx.resume();const s=ctx.createBufferSource();s.buffer=await buf(u);const g=ctx.createGain();g.gain.value=0.8;s.connect(g);g.connect(ctx.destination);s.start()}
document.querySelectorAll('button').forEach(b=>{let t;b.addEventListener('pointerdown',()=>{play(b.dataset.s);let n=0;t=setTimeout(function run(){play(b.dataset.s);n++;t=setTimeout(run,n<3?140:n<6?220:360)},300)});['pointerup','pointerleave'].forEach(e=>b.addEventListener(e,()=>clearTimeout(t)))});</script></body></html>
